[package]
name = "khama"
version = "0.2.0"
description = "أداة تنزيل وسائط للممنتجين — Media downloader for video editors"
authors = ["jake750"]
license = "MIT"
edition = "2024"

[lib]
# اللاحقة _lib ضرورية على Windows حتى لا يتعارض اسم المكتبة مع اسم البرنامج
name = "khama_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# إشعار عند انتهاء التنزيل، وقراءة الحافظة (لصق الرابط ومراقبتها)
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# لتشغيل yt-dlp و ffmpeg كعمليات منفصلة وقراءة مخرجاتها سطرًا بسطر
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "time", "fs"] }
# لفك صفحات سبوتيفاي التي يجلبها yt-dlp (قوائم التشغيل)، ولتحويل الصورة المصغّرة إلى data URL
base64 = "0.22"

# المحوّل وإزالة الموسيقى للكمبيوتر فقط (نسخة الهاتف الأولى: تنزيل فقط)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# إزالة الموسيقى: ONNX Runtime يُحمَّل من ملف يُنزَّل عند أول استخدام (لا يُضمَّن في التطبيق)
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic"] }
rustfft = "6"
sha2 = "0.10"
# التحديث التلقائي للتطبيق نفسه، ثم إعادة تشغيله (للكمبيوتر فقط؛ أندرويد يتحدّث من المتجر/الملف)
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# سحب الملف من بطاقة التنزيل إلى برنامج المونتاج مباشرة
tauri-plugin-drag = "2"
# نسخة واحدة من التطبيق (فتحه مرة ثانية يُظهر النافذة المخفية في شريط المهام)
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# في وضع التطوير: نحسّن مكتبات الحساب الثقيل فقط (إزالة الموسيقى بطيئة جدًا بدونها)
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.khama]
opt-level = 2
