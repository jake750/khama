[package]
name = "khama"
version = "0.3.34"
description = "أداة تنزيل وسائط للممنتجين — Media downloader for video editors"
authors = ["jake750"]
license = "MIT"
edition = "2024"
# let-chains (if let ... && ...) تحتاج 1.88
rust-version = "1.88"
default-run = "khama"

[lib]
# اللاحقة _lib ضرورية على Windows حتى لا يتعارض اسم المكتبة مع اسم البرنامج
name = "khama_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# أداة القياس لمشروع التخرّج (bench/): تشغّل كود التطبيق نفسه على مجموعات الاختبار.
# لا تُبنى مع التطبيق: cargo run --release --features bench --bin khama-bench -- ...
[features]
bench = []

[[bin]]
name = "khama-bench"
path = "src/bin/khama-bench.rs"
required-features = ["bench"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# نفس السطر الفرعي لحزمة @tauri-apps/api في package.json (~2.12): الجسر بينهما يجب أن يتطابق (T-82)
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# إشعار عند انتهاء التنزيل، وقراءة الحافظة (لصق الرابط ومراقبتها)
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
# المنصة (هاتف أو كمبيوتر) للواجهة بدل تخمينها من userAgent
tauri-plugin-os = "2"
# سجلّ أخطاء في ملف دوّار يمكن للمستخدم إرساله عند البلاغ (T-29)
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# لتشغيل yt-dlp و ffmpeg كعمليات منفصلة وقراءة مخرجاتها سطرًا بسطر
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "time", "fs"] }
# لفك صفحات سبوتيفاي التي يجلبها yt-dlp (قوائم التشغيل)، ولتحويل الصورة المصغّرة إلى data URL
base64 = "0.23"

# إزالة الموسيقى: ONNX Runtime يُحمَّل وقت التشغيل (يُنزَّل على الكمبيوتر، ومضمّن في تطبيق أندرويد)
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }
rustfft = "6"
sha2 = "0.11"
# ترجمات بترميز قديم (Windows-1256 وغيره) تُقرأ صحيحة بدل رموز مكسورة (RC10)
encoding_rs = "0.8"
chardetng = "0.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# التحديث التلقائي للتطبيق نفسه، ثم إعادة تشغيله (للكمبيوتر فقط؛ أندرويد يتحدّث من المتجر/الملف)
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# سحب الملف من بطاقة التنزيل إلى برنامج المونتاج مباشرة
tauri-plugin-drag = "2"
# نسخة واحدة من التطبيق (فتحه مرة ثانية يُظهر النافذة المخفية في شريط المهام)،
# وتمرّر روابط khama:// للنسخة المفتوحة
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# روابط khama://download?url=... من المتصفح (T-101)
tauri-plugin-deep-link = "2"

# المساحة الحرة على القرص قبل التنزيل (T-96)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_JobObjects", "Win32_System_Threading"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# بلا panic = "abort": انهيار مهمة في الخلفية يبقى داخلها ولا يُغلق التطبيق كله (T-28)
strip = true

# في وضع التطوير: نحسّن مكتبات الحساب الثقيل فقط (إزالة الموسيقى بطيئة جدًا بدونها)
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.khama]
opt-level = 2

[dev-dependencies]
# يولّد أنواع TypeScript من هياكل Rust في الاختبارات فقط، ليفحص tsc أن api.ts لم يبتعد عنها (T-53)
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
