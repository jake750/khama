[package]
name = "khama"
version = "0.1.0"
description = "أداة تنزيل وسائط للممنتجين — Media downloader for video editors"
authors = ["jake750"]
license = "MIT"
edition = "2024"

[lib]
# اللاحقة _lib ضرورية على Windows حتى لا يتعارض اسم المكتبة مع اسم البرنامج
name = "khama_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# لتشغيل yt-dlp و ffmpeg كعمليات منفصلة وقراءة مخرجاتها سطرًا بسطر
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "time", "fs"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
