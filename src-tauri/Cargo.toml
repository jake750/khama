[package]
name = "khama"
version = "0.3.3"
description = "أداة تنزيل وسائط للممنتجين — Media downloader for video editors"
authors = ["jake750"]
license = "MIT"
edition = "2024"

[lib]
# اللاحقة _lib ضرورية على Windows حتى لا يتعارض اسم المكتبة مع اسم البرنامج
name = "khama_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# إشعار عند انتهاء التنزيل، وقراءة الحافظة (لصق الرابط ومراقبتها)
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
# المنصة (هاتف أو كمبيوتر) للواجهة بدل تخمينها من userAgent
tauri-plugin-os = "2"
# سجلّ أخطاء في ملف دوّار يمكن للمستخدم إرساله عند البلاغ (T-29)
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# لتشغيل yt-dlp و ffmpeg كعمليات منفصلة وقراءة مخرجاتها سطرًا بسطر
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "time", "fs"] }
# لفك صفحات سبوتيفاي التي يجلبها yt-dlp (قوائم التشغيل)، ولتحويل الصورة المصغّرة إلى data URL
base64 = "0.22"

# إزالة الموسيقى: ONNX Runtime يُحمَّل وقت التشغيل (يُنزَّل على الكمبيوتر، ومضمّن في تطبيق أندرويد)
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic"] }
rustfft = "6"
sha2 = "0.10"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# التحديث التلقائي للتطبيق نفسه، ثم إعادة تشغيله (للكمبيوتر فقط؛ أندرويد يتحدّث من المتجر/الملف)
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# سحب الملف من بطاقة التنزيل إلى برنامج المونتاج مباشرة
tauri-plugin-drag = "2"
# نسخة واحدة من التطبيق (فتحه مرة ثانية يُظهر النافذة المخفية في شريط المهام)،
# وتمرّر روابط khama:// للنسخة المفتوحة
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# روابط khama://download?url=... من المتصفح (T-101)
tauri-plugin-deep-link = "2"

# المساحة الحرة على القرص قبل التنزيل (T-96)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# بلا panic = "abort": انهيار مهمة في الخلفية يبقى داخلها ولا يُغلق التطبيق كله (T-28)
strip = true

# في وضع التطوير: نحسّن مكتبات الحساب الثقيل فقط (إزالة الموسيقى بطيئة جدًا بدونها)
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.khama]
opt-level = 2
