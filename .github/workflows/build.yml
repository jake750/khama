# يبني ملفات التثبيت للأنظمة الثلاثة.
# - يدويًا: من تبويب Actions ← Build ← Run workflow (الملفات تظهر كـ artifacts)
# - عند رفع وسم مثل v0.1.0: يُنشئ مسودة Release فيها كل ملفات التثبيت
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest # Intel: يُبنى على جهاز Apple Silicon لمعمارية x86_64
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Fetch bundled tools (yt-dlp, FFmpeg, Deno)
        run: node scripts/fetch-binaries.mjs ${{ matrix.target }}

      - name: Smoke-test bundled tools
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          src-tauri/binaries/khama-yt-dlp-${{ matrix.target }}$ext --version
          src-tauri/binaries/khama-deno-${{ matrix.target }}$ext --version
          src-tauri/binaries/ffmpeg/bin/ffmpeg$ext -hide_banner -version | head -1
          src-tauri/binaries/ffmpeg/bin/ffmpeg$ext -hide_banner -encoders | grep libx264

      - name: Rust unit tests
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Khama ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: khama-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: ignore
