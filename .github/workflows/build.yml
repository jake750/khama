# يبني ملفات التثبيت للأنظمة الثلاثة مع الـ APK.
# - عند دفع إلى main يغيّر رقم الإصدار في tauri.conf.json (npm run release): إذا لم يوجد وسم vX.Y.Z
#   بعد، يبني كل شيء وينشر الإصدار، وtauri-action تنشئ الوسم. (الفحص هنا لا في workflow منفصل
#   لأن الوسم الذي يدفعه GITHUB_TOKEN لا يشغّل workflows أخرى.)
# - دفع وسم v* يدويًا يعمل أيضًا.
# - يدويًا من Actions ← Build ← Run workflow: يبني فقط، والملفات تظهر كـ artifacts.
name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [src-tauri/tauri.conf.json]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # release: هل ننشر إصدارًا؟ has_key: هل أُضيف مفتاح توقيع أندرويد؟ (لا تُقرأ secrets في if الخاصة بالـ job)
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.version.outputs.build }}
      release: ${{ steps.version.outputs.release }}
      has_key: ${{ steps.version.outputs.has_key }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          KEY: ${{ secrets.KHAMA_KEYSTORE_BASE64 }}
        run: |
          echo "has_key=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          v="v$(jq -r .version src-tauri/tauri.conf.json)"
          if git ls-remote --exit-code --tags origin "refs/tags/$v" > /dev/null; then
            echo "$v موسوم بالفعل، لا إصدار جديد"
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "إصدار $v"
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest # Intel: يُبنى على جهاز Apple Silicon لمعمارية x86_64
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Fetch bundled tools (yt-dlp, FFmpeg, Deno)
        run: node scripts/fetch-binaries.mjs ${{ matrix.target }}

      - name: Smoke-test bundled tools
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          src-tauri/binaries/khama-yt-dlp-${{ matrix.target }}$ext --version
          src-tauri/binaries/khama-deno-${{ matrix.target }}$ext --version
          src-tauri/binaries/ffmpeg/bin/ffmpeg$ext -hide_banner -version | head -1
          src-tauri/binaries/ffmpeg/bin/ffmpeg$ext -hide_banner -encoders | grep libx264

      - name: Rust unit tests
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # مكتبات FFmpeg مبنية بأدوات أحدث من strip الموجود في Ubuntu 22.04،
          # فنمنع linuxdeploy من "تجريدها" حتى لا يفشل بناء AppImage
          NO_STRIP: "true"
          # linuxdeploy يبحث عن مكتبات FFmpeg المشتركة في مسارات النظام فقط؛ ندلّه على مجلدها
          LD_LIBRARY_PATH: ${{ runner.os == 'Linux' && format('{0}/src-tauri/binaries/ffmpeg/lib', github.workspace) || '' }}
          # مفتاح توقيع التحديثات (أسرار المستودع). بدونه نبني كالعادة بلا ملفات تحديث،
          # ومعه تُوقَّع ملفات التثبيت ويُرفع latest.json مع الإصدار فيراه التطبيق المثبّت
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }} ${{ runner.os == 'Linux' && '--verbose' || '' }} ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '--config src-tauri/tauri.updater.conf.json' || '' }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || (needs.check.outputs.release == 'true' && 'v__VERSION__' || '') }}
          releaseName: "Khama v__VERSION__"
          releaseDraft: false
          prerelease: false

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: khama-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: ignore

  # APK موقّع لـ arm64 يُرفع إلى الإصدار نفسه. يحتاج الأسرار KHAMA_KEYSTORE_BASE64 و KHAMA_KEY_PASSWORD
  # (يقرؤها build.gradle.kts من متغيرات KHAMA_*)، وبدونها تُتخطّى هذه المهمة.
  android:
    needs: check
    if: needs.check.outputs.build == 'true' && needs.check.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: aarch64-linux-android

      - run: npm ci --silent

      # المفتاح نفسه الذي على جهازك، وإلا رفض أندرويد تثبيت التحديث فوق النسخة القديمة
      - name: Signing key
        env:
          KEY: ${{ secrets.KHAMA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEY" | base64 -d > "$RUNNER_TEMP/khama.jks"
          echo "KHAMA_KEYSTORE=$RUNNER_TEMP/khama.jks" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          KHAMA_KEY_PASSWORD: ${{ secrets.KHAMA_KEY_PASSWORD }}
        run: npx tauri android build --apk --split-per-abi --target aarch64 --ci

      - name: Name and verify APK
        run: |
          v=$(jq -r .version src-tauri/tauri.conf.json)
          mkdir -p out
          cp src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk "out/Khama_${v}_android-arm64.apk"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$apksigner" verify --print-certs out/*.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: khama-android-arm64
          path: out/*.apk
          if-no-files-found: error

      - name: Attach to the release
        if: needs.check.outputs.release == 'true'
        run: |
          v="v$(jq -r .version src-tauri/tauri.conf.json)"
          # مهام سطح المكتب هي التي تنشئ الإصدار؛ ننتظره حتى 40 دقيقة
          for i in $(seq 1 80); do
            gh release view "$v" > /dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "$v" out/*.apk --clobber
