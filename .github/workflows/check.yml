# فحص الجودة مع كل push وكل Pull Request: الأنواع، والفحص، والتنسيق، والاختبارات، وأمان الاعتماديات.
# الإجراءات مثبّتة على commit محدد (لا وسم يمكن تحريكه)، وDependabot يحدّثها.
name: Check

# push على main فقط، وطلبات الدمج (فروع Dependabot كانت تُفحص مرتين: push ثم pull_request)
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# دفعة أحدث على فرع طلب دمج تلغي فحص السابقة. على main لا: الإصدار ينتظر فحص commit الإصدار بعينه
# (build.yml)، فدفعة docs بعده كانت ستلغيه وتوقف الإصدار
concurrency:
  group: check-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        # الواجهة، ثم ملفات الإعداد واختبارات e2e (لم يكن يفحصها شيء)
        run: npx tsc --noEmit && npx tsc --noEmit -p tsconfig.node.json
      - name: ESLint
        run: npx eslint src --max-warnings 25
      - name: Prettier
        run: npx prettier --check .
      - name: Vitest
        run: npx vitest run
      - name: UI size budget (docs/PERFORMANCE.md)
        run: npx vite build && node scripts/size-budget.mjs
      - name: npm audit (production)
        run: npm audit --omit=dev --audit-level=high

  # اختبارات الطرف للطرف (T-16): الواجهة في Chromium مع dev-mock.ts، بلا Rust.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: نسخة Playwright
        id: pw
        run: echo "v=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pwcache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.v }}
      - name: Chromium فقط
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run e2e

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
      # tauri-build يشترط وجود الأدوات المضمّنة؛ للفحص تكفي ملفات فارغة (الاختبارات التي تحتاج الأدوات الحقيقية معلَّمة ignore)
      - name: Placeholder bundled tools
        run: |
          t=x86_64-unknown-linux-gnu
          mkdir -p src-tauri/binaries/ffmpeg/bin
          touch src-tauri/binaries/khama-yt-dlp-$t src-tauri/binaries/khama-deno-$t src-tauri/binaries/ffmpeg/bin/ffmpeg
          chmod +x src-tauri/binaries/khama-*
      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: clippy
        # --features bench: أداة القياس (bench/) تُبنى أيضًا، وإلا انكسرت مع تغيّر واجهات المكتبة دون أن يُلاحظ
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features bench -- -D warnings
      - name: tests
        # .cargo/config.toml محلي (لا يُرفع)، فبدون هذا تكتب ts-rs في src-tauri/bindings ولا يُفحص شيء
        env:
          TS_RS_EXPORT_DIR: ${{ github.workspace }}/src/bindings
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      # T-53: cargo test يعيد توليد src/bindings من هياكل Rust؛ أي فرق (أو ملف جديد) يعني أنها لم تُحدَّث
      - name: Rust types match src/bindings
        run: |
          git diff --exit-code -- src/bindings
          test -z "$(git status --porcelain -- src/bindings)"

  # Windows هو النظام الأساسي للمستخدمين، وكود cfg(windows) (المسارات، الأسماء المحجوزة، العمليات)
  # لم يكن يُبنى إلا عند الإصدار (IN7)
  rust-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
      - name: Placeholder bundled tools
        run: |
          t=x86_64-pc-windows-msvc
          mkdir -p src-tauri/binaries/ffmpeg/bin
          touch src-tauri/binaries/khama-yt-dlp-$t.exe src-tauri/binaries/khama-deno-$t.exe src-tauri/binaries/ffmpeg/bin/ffmpeg.exe
      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  # كود أندرويد (mobile.rs وما تحت cfg(mobile)) لا يُبنى إلا عند الإصدار، فينحرف دون أن يلاحظ أحد (T-36).
  # clippy فقط (بلا ربط ولا توقيع): دقيقة أو اثنتان، ويكشف كسر البناء على الهاتف في كل دفعة.
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          key: android
      - name: NDK compilers for build scripts
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$bin/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
      - name: clippy (aarch64-linux-android)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib --target aarch64-linux-android -- -D warnings

  audit:
    runs-on: ubuntu-24.04
    # cargo audit مباشرة لا rustsec/audit-check: ذاك يكتب نتيجته check run عبر API، وكان يفشل
    # بـ «Not Found» أحيانًا رغم أنه لم يجد ثغرة. هنا يفشل فقط إن وُجدت ثغرة فعلًا.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit --file src-tauri/Cargo.lock
