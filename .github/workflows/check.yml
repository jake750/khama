# فحص الجودة مع كل push وكل Pull Request: الأنواع، والفحص، والتنسيق، والاختبارات، وأمان الاعتماديات.
# الإجراءات مثبّتة على commit محدد (لا وسم يمكن تحريكه)، وDependabot يحدّثها.
name: Check

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npx eslint src --max-warnings 25
      - name: Prettier
        run: npx prettier --check .
      - name: Vitest
        run: npx vitest run --dir src
      - name: UI size budget (docs/PERFORMANCE.md)
        run: npx vite build && node scripts/size-budget.mjs
      - name: npm audit (production)
        run: npm audit --omit=dev --audit-level=high

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
      # tauri-build يشترط وجود الأدوات المضمّنة؛ للفحص تكفي ملفات فارغة (الاختبارات التي تحتاج الأدوات الحقيقية معلَّمة ignore)
      - name: Placeholder bundled tools
        run: |
          t=x86_64-unknown-linux-gnu
          mkdir -p src-tauri/binaries/ffmpeg/bin
          touch src-tauri/binaries/khama-yt-dlp-$t src-tauri/binaries/khama-deno-$t src-tauri/binaries/ffmpeg/bin/ffmpeg
          chmod +x src-tauri/binaries/khama-*
      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      # T-53: cargo test يعيد توليد src/bindings من هياكل Rust؛ أي فرق يعني أنها لم تُحدَّث
      - name: Rust types match src/bindings
        run: git diff --exit-code -- src/bindings

  # كود أندرويد (mobile.rs وما تحت cfg(mobile)) لا يُبنى إلا عند الإصدار، فينحرف دون أن يلاحظ أحد (T-36).
  # clippy فقط (بلا ربط ولا توقيع): دقيقة أو اثنتان، ويكشف كسر البناء على الهاتف في كل دفعة.
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          key: android
      - name: NDK compilers for build scripts
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$bin/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
      - name: clippy (aarch64-linux-android)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib --target aarch64-linux-android -- -D warnings

  audit:
    runs-on: ubuntu-24.04
    # cargo audit مباشرة لا rustsec/audit-check: ذاك يكتب نتيجته check run عبر API، وكان يفشل
    # بـ «Not Found» أحيانًا رغم أنه لم يجد ثغرة. هنا يفشل فقط إن وُجدت ثغرة فعلًا.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit --file src-tauri/Cargo.lock
